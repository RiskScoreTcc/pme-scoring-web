<div class="application-shell">

  <!-- =====================================================
       NAVEGAÇÃO PRINCIPAL
       ===================================================== -->

  <aside id="main-navigation" class="main-navigation" [class.is-collapsed]="!isNavigationOpen"
    aria-label="Navegação principal">

    <!-- ===================================================
         CABEÇALHO DA NAVEGAÇÃO
         =================================================== -->

    <div class="navigation-header">

      <a routerLink="/overview" class="application-brand" aria-label="PME Scoring - Visão Geral">

        <span class="brand-name">
          PME Scoring
        </span>

        <span class="brand-symbol" aria-hidden="true">
          PS
        </span>

      </a>


      <!-- Botão utilizado no mobile -->

      <button type="button" class="navigation-close" (click)="closeNavigation()" aria-label="Fechar menu de navegação">

        <span aria-hidden="true">
          ×
        </span>

      </button>

    </div>


    <!-- ===================================================
         MENU PRINCIPAL
         =================================================== -->

    <nav class="navigation-menu" aria-label="Menu principal">

      <ul>

        <!-- =================================================
             VISÃO GERAL
             ================================================= -->

        <li>

          <a routerLink="/overview" routerLinkActive="is-active" [routerLinkActiveOptions]="{
              exact: true
            }" #overviewLink="routerLinkActive" [attr.aria-current]="
              overviewLink.isActive
                ? 'page'
                : null
            " (click)="closeNavigation()">

            <span class="navigation-icon" aria-hidden="true">
              ▦
            </span>

            <span class="navigation-label">
              Visão Geral
            </span>

          </a>

        </li>


        <!-- =================================================
             EMPRESAS
             ================================================= -->

        <li>

          <a routerLink="/companies" routerLinkActive="is-active" #companiesLink="routerLinkActive" [attr.aria-current]="
              companiesLink.isActive
                ? 'page'
                : null
            " (click)="closeNavigation()">

            <span class="navigation-icon" aria-hidden="true">
              ▣
            </span>

            <span class="navigation-label">
              Empresas
            </span>

          </a>

        </li>


        <!-- =================================================
             OCORRÊNCIAS
             ================================================= -->

        <li>

          <a routerLink="/occurrences" routerLinkActive="is-active" #occurrencesLink="routerLinkActive"
            [attr.aria-current]="
              occurrencesLink.isActive
                ? 'page'
                : null
            " (click)="closeNavigation()">

            <span class="navigation-icon" aria-hidden="true">
              !
            </span>

            <span class="navigation-label">
              Ocorrências
            </span>

          </a>

        </li>


        <!-- =================================================
             OPÇÕES EXCLUSIVAS DO ADMINISTRADOR
             ================================================= -->

        @if (isAdmin()) {

        <!-- Configuração de Pesos -->

        <li>

          <a routerLink="/weights" routerLinkActive="is-active" #weightsLink="routerLinkActive" [attr.aria-current]="
                weightsLink.isActive
                  ? 'page'
                  : null
              " (click)="closeNavigation()">

            <span class="navigation-icon" aria-hidden="true">
              ⚖
            </span>

            <span class="navigation-label">
              Configuração de Pesos
            </span>

          </a>

        </li>


        <!-- Usuários e Acessos -->

        <li>

          <a routerLink="/users" routerLinkActive="is-active" #usersLink="routerLinkActive" [attr.aria-current]="
                usersLink.isActive
                  ? 'page'
                  : null
              " (click)="closeNavigation()">

            <span class="navigation-icon" aria-hidden="true">
              ♙
            </span>

            <span class="navigation-label">
              Usuários e Acessos
            </span>

          </a>

        </li>

        }

      </ul>

    </nav>

  </aside>


  <!-- =====================================================
       OVERLAY MOBILE
       ===================================================== -->

  <button type="button" class="navigation-overlay" [class.is-visible]="isNavigationOpen" (click)="closeNavigation()"
    aria-label="Fechar menu de navegação">
  </button>


  <!-- =====================================================
       CONTEÚDO PRINCIPAL
       ===================================================== -->

  <div class="application-content">

    <!-- ===================================================
         CABEÇALHO
         =================================================== -->

    <header class="application-header">

      <!-- Botão do menu -->

      <button type="button" class="navigation-toggle" (click)="toggleNavigation()"
        [attr.aria-expanded]="isNavigationOpen" aria-controls="main-navigation" aria-label="Alternar menu de navegação">

        <span aria-hidden="true">
          ☰
        </span>

      </button>


      <!-- =================================================
           USUÁRIO AUTENTICADO
           ================================================= -->

      <div class="current-user">

        <!-- Informações do usuário -->

        <div class="current-user-information">

          <span class="current-user-name">
            {{ currentUserName() }}
          </span>

          <span class="current-user-role">
            {{ currentUserRole() }}
          </span>

        </div>


        <!-- Avatar -->

        <button type="button" class="current-user-avatar" [attr.aria-expanded]="isUserMenuOpen()" aria-haspopup="menu"
          aria-controls="user-menu" aria-label="Abrir menu do usuário" (click)="toggleUserMenu()">

          <span aria-hidden="true">
            {{ currentUserInitials() }}
          </span>

        </button>


        <!-- =================================================
             MENU DO USUÁRIO
             ================================================= -->

        @if (isUserMenuOpen()) {

        <div id="user-menu" class="user-menu" role="menu" aria-label="Opções do usuário">

          <!-- Dados do usuário -->

          <div class="user-menu-header">

            <span class="user-menu-email">
              {{ currentUserEmail() }}
            </span>

            <span class="user-menu-role">
              {{ currentUserRole() }}
            </span>

          </div>


          <!-- Separador -->

          <div class="user-menu-divider" aria-hidden="true">
          </div>


          <!-- Logout -->

          <button type="button" class="user-menu-action" role="menuitem" (click)="logout()">

            <span class="user-menu-icon" aria-hidden="true">
              →
            </span>

            <span>
              Sair
            </span>

          </button>

        </div>

        }

      </div>

    </header>


    <!-- ===================================================
         CONTEÚDO DAS ROTAS
         =================================================== -->

    <main class="route-content" id="main-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
